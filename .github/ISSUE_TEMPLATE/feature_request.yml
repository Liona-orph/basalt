name: Feature request
description: Propose something Basalt should be able to do.
title: '[feature] '
labels: [enhancement]
body:
  - type: markdown
    attributes:
      value: |
        Basalt is a from-first-principles engine written to be understood, not a
        DuckDB competitor. Proposals are weighed on what they teach as much as
        on what they add, and a feature that would be implemented by taking a
        dependency will usually be declined — see the dependency policy at the
        top of `Cargo.toml`.

        Several things are already known to be missing (optimizer, executor,
        `EXCEPT`/`INTERSECT`, scalar subqueries, nested types). Check the
        [status section](https://github.com/basalt-db/basalt#status-and-what-is-not-implemented)
        first; an issue that adds detail to a known gap is welcome, a duplicate
        of it is not.

  - type: textarea
    id: problem
    attributes:
      label: What are you trying to do
      description: >
        The problem, not the solution. Some current limitations have workarounds
        that may be enough, and knowing the goal is what makes them findable.
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed behaviour
      description: What should Basalt do? Include the SQL or the API you would write.
    validations:
      required: true

  - type: dropdown
    id: area
    attributes:
      label: Area
      options:
        - type system / coercion
        - columnar arrays
        - encoding / compression
        - segment format / storage
        - SQL syntax
        - binder / logical plan
        - tooling, CI, docs
        - other
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives considered
      description: >
        What else would solve this, and why is it worse? An honest comparison is
        the most useful part of a proposal.

  - type: textarea
    id: cost
    attributes:
      label: What it would cost
      description: >
        New dependencies, format or API breakage, extra cases in every kernel,
        performance. Say so even if the answer is "nothing obvious".
