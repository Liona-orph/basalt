name: Audit

on:
  schedule:
    # 06:17 UTC on Mondays. Off the hour on purpose: advisories are published
    # continuously and every project scheduling itself at :00 makes the RustSec
    # database's traffic spikier than it needs to be.
    - cron: '17 6 * * 1'
  push:
    paths:
      - '**/Cargo.toml'
      - 'Cargo.lock'
      - '.github/workflows/audit.yml'
  workflow_dispatch:

concurrency:
  group: audit-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  audit:
    name: cargo audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      # The project itself stays on Rust 1.83, while cargo-audit needs a newer
      # compiler. The audit tool never compiles Basalt, so run it explicitly
      # under stable instead of making the project toolchain drift.
      - uses: dtolnay/rust-toolchain@4360b52568e2003a75bf9bc1d59f33a8e3fc893c # stable
        with:
          toolchain: stable
      - name: Install cargo-audit
        run: cargo +stable install cargo-audit --version 0.22.2 --locked
      - name: Audit Cargo.lock
        run: cargo +stable audit
