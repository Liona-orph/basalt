version: 2

updates:
  # The workspace has one runtime dependency and three dev-dependencies, two of
  # which are exact-pinned to the newest release that still builds on the
  # pinned 1.83 toolchain. Dependabot will therefore be quiet, and when it is
  # not, the PR is worth reading carefully.
  - package-ecosystem: cargo
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
    commit-message:
      prefix: 'deps'
    groups:
      dev-dependencies:
        dependency-type: development

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      time: '06:00'
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: 'ci'
    groups:
      actions:
        patterns:
          - '*'
